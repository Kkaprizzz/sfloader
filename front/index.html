<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>SFLoader</title>
    <!-- Экран загрузки: виден, пока грузится бандл и первые данные, поэтому
         стили здесь, а не в CSS из бандла. Тот же экран рисует App (Splash),
         пока не придут очередь и история. -->
    <style>
      html, body, #root { margin: 0; height: 100%; background: #161617; }
      .splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font: 600 22px/1 'IBM Plex Sans Variable', system-ui, sans-serif;
        letter-spacing: 0.01em;
        color: #a0a0a8;
        user-select: none;
        -webkit-app-region: drag;
      }
      .splash-brand span { color: #3fb950; }
      .splash-bar {
        position: relative;
        width: 120px;
        height: 2px;
        overflow: hidden;
        background: #2c2c30;
      }
      .splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        background: #3fb950;
        animation: splash-run 1.1s cubic-bezier(0.2, 0, 0, 1) infinite;
      }
      @keyframes splash-run {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-bar::after { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Загрузка">
        <div class="splash-brand"><span>sf</span>loader</div>
        <div class="splash-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
